<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1f" />
      <stop offset="50%" stop-color="#1b0c36" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="batonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer vinyl grooves -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#glowGrad)" stroke-opacity="0.4" stroke-width="6" />

  <!-- Outer Soundwaves -->
  <path d="M120 256 A 136 136 0 0 1 140 180" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M372 180 A 136 136 0 0 1 392 256" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M100 256 A 156 156 0 0 1 125 160" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  <path d="M387 160 A 156 156 0 0 1 412 256" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round" opacity="0.7" />

  <!-- Center Disc -->
  <circle cx="256" cy="256" r="95" fill="#090514" stroke="url(#glowGrad)" stroke-width="5" filter="url(#glow)" />
  
  <!-- Glowing Baton / Relay Scepter -->
  <g transform="rotate(-45 256 256)">
    <!-- Baton Shaft -->
    <rect x="244" y="160" width="24" height="192" rx="12" fill="url(#batonGrad)" filter="url(#glow)" />
    <!-- Baton Top Orb -->
    <circle cx="256" cy="160" r="22" fill="#fef08a" stroke="#f59e0b" stroke-width="4" />
    <!-- Baton Bottom Grip Ring -->
    <circle cx="256" cy="352" r="18" fill="#f59e0b" />
    <rect x="240" y="246" width="32" height="20" rx="6" fill="#ffffff" fill-opacity="0.9" />
  </g>

  <!-- Crown Emblem at top -->
  <path d="M 230 115 L 243 130 L 256 110 L 269 130 L 282 115 L 282 140 L 230 140 Z" fill="#fbbf24" />
</svg>
